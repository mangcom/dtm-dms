services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtm_password}
      POSTGRES_DB: ${POSTGRES_DB:-dtm_dms}
    ports:
      - "5432:5432"
    volumes:
      - dtm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dtm}:${POSTGRES_PASSWORD:-dtm_password}@postgres:5432/${POSTGRES_DB:-dtm_dms}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - dtm_uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dtm_postgres_data:
  dtm_uploads_data:
